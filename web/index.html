<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Hermes-live</title>
<link rel="icon" type="image/png" href="/web/favicon.png">
<style>
  :root { color-scheme: dark; }
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #21262d;
    --fg: #e6edf3; --dim: #8b949e; --user: #1f6feb; --err: #f85149;
    --orb1: #58a6ff; --orb2: #bc8cff;
    /* 状态色：可接收语音=蓝，工作中(思考/播报)=紫红 */
    --blue1: #58a6ff; --blue2: #1f6feb;
    --mag1: #d977ff; --mag2: #bc5cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header { padding: 8px 12px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  header .row { display: flex; align-items: center; gap: 8px; }
  header .row + .row { margin-top: 8px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  #status {
    color: var(--dim); font-size: 13px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  header .spacer { flex: 1; }
  button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--user); border-color: var(--user); }
  button:disabled { opacity: .4; cursor: default; }
  select {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 6px; font-size: 13px;
    min-width: 0; flex-shrink: 1;         /* 窄屏允许收窄，靠省略号活下来 */
  }

  #stage { display: flex; flex-direction: column; align-items: center; padding: 20px 0 8px; flex-shrink: 0; }
  #orb {
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, var(--mag1), var(--mag2) 75%);
    filter: saturate(.4) brightness(.55); transition: filter .3s, transform .12s;
    cursor: pointer;
  }
  #orb.listening { background: radial-gradient(circle at 32% 30%, var(--blue1), var(--blue2) 75%); filter: none; box-shadow: 0 0 42px #58a6ff55; }
  #orb.thinking  { filter: none; animation: breathe 1.4s ease-in-out infinite; }
  #orb.speaking  { filter: none; animation: breathe .9s ease-in-out infinite; box-shadow: 0 0 52px #bc8cff66; }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  #stateLabel { margin-top: 12px; color: var(--dim); font-size: 13px; min-height: 20px; }
  #partialText {
    margin-top: 6px; padding: 4px 12px;
    color: var(--fg); font-size: 14px; font-style: italic; opacity: 0.7;
    min-height: 20px; max-width: 340px; text-align: center;
    transition: opacity .15s;
  }
  #partialText:empty { opacity: 0; }

  #transcript {
    flex: 1; overflow-y: auto; padding: 10px 18px 18px;
    display: flex; flex-direction: column; gap: 10px; max-width: 780px;
    width: 100%; margin: 0 auto;
  }
  .bubble { max-width: 82%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--user); }
  .agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .tool { align-self: flex-start; color: var(--dim); font-size: 12.5px; padding: 0 4px; }
  .error { align-self: center; color: var(--err); font-size: 13px; }

  footer {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line);
    max-width: 780px; width: 100%; margin: 0 auto; flex-shrink: 0;
  }
  #textIn {
    flex: 1; background: var(--panel); color: var(--fg);
    -webkit-appearance: none; -webkit-text-fill-color: var(--fg); caret-color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px;
    min-width: 0;
  }
  #textIn:focus { outline: none; border-color: var(--user); }
  #btnAttach { padding: 8px 10px; }
  #dropOverlay {
    position: fixed; inset: 0; display: none; z-index: 99;
    background: rgba(13, 17, 23, .82); pointer-events: none;  /* 让 drag 事件穿透 */
    align-items: center; justify-content: center;
  }
  #dropOverlay.show { display: flex; }
  #dropOverlay .hint {
    border: 2px dashed var(--user); border-radius: 14px;
    padding: 26px 34px; color: var(--fg); font-size: 15px;
  }
</style>
</head>
<body>
  <header>
    <div class="row">
      <h1>Hermes-live</h1>
      <span id="status">未连接</span>
      <span class="spacer"></span>
      <button id="btnToggle" class="primary">开始对话</button>
    </div>
    <div class="row">
      <select id="selVoice" title="音色">
        <option value="zh-CN-XiaoxiaoNeural">晓晓（女）</option>
        <option value="zh-CN-YunxiNeural">云希（男）</option>
        <option value="zh-CN-XiaoyiNeural">晓伊（女）</option>
        <option value="zh-CN-YunjianNeural">云健（男）</option>
      </select>
      <select id="selRate" title="语速">
        <option value="+0%">语速 1.0x</option>
        <option value="+15%">语速 1.15x</option>
        <option value="+30%" selected>语速 1.3x</option>
        <option value="-15%">语速 0.85x</option>
      </select>
      <span class="spacer"></span>
      <button id="btnInterrupt" disabled>打断</button>
      <button id="btnNewSession">新会话</button>
      <button id="btnRestart">重启服务</button>
    </div>
  </header>

  <div id="stage">
    <div id="orb"></div>
    <div id="stateLabel">点「开始对话」授权麦克风</div>
    <div id="partialText"></div>
  </div>

  <div id="transcript"></div>

  <footer>
    <button id="btnAttach" title="发附件（也可直接拖文件进窗口）">📎</button>
    <input id="fileIn" type="file" multiple hidden>
    <input id="textIn" placeholder="也可以打字（回车发送）…">
    <button id="btnSend">发送</button>
  </footer>

  <div id="dropOverlay"><div class="hint">📁 松手上传，路径自动填入输入框</div></div>

  <script type="module" src="/web/app.js"></script>
</body>
</html>
