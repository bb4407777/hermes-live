<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes-live</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #21262d;
    --fg: #e6edf3; --dim: #8b949e; --user: #1f6feb; --err: #f85149;
    --orb1: #58a6ff; --orb2: #bc8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #status { color: var(--dim); font-size: 13px; }
  header .spacer { flex: 1; }
  button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--user); border-color: var(--user); }
  button:disabled { opacity: .4; cursor: default; }

  #stage { display: flex; flex-direction: column; align-items: center; padding: 26px 0 10px; }
  #orb {
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, var(--orb1), var(--orb2) 75%);
    filter: saturate(.4) brightness(.55); transition: filter .3s, transform .12s;
  }
  #orb.listening { filter: none; box-shadow: 0 0 42px #58a6ff55; }
  #orb.thinking  { filter: hue-rotate(40deg); animation: breathe 1.4s ease-in-out infinite; }
  #orb.speaking  { filter: hue-rotate(-25deg); animation: breathe .9s ease-in-out infinite; box-shadow: 0 0 52px #bc8cff66; }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  #stateLabel { margin-top: 12px; color: var(--dim); font-size: 13px; min-height: 20px; }

  #transcript {
    flex: 1; overflow-y: auto; padding: 10px 18px 18px;
    display: flex; flex-direction: column; gap: 10px; max-width: 780px;
    width: 100%; margin: 0 auto;
  }
  .bubble { max-width: 82%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--user); }
  .agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .tool { align-self: flex-start; color: var(--dim); font-size: 12.5px; padding: 0 4px; }
  .error { align-self: center; color: var(--err); font-size: 13px; }

  footer {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line);
    max-width: 780px; width: 100%; margin: 0 auto;
  }
  #textIn {
    flex: 1; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px;
  }
  #textIn:focus { outline: none; border-color: var(--user); }
</style>
</head>
<body>
  <header>
    <h1>Hermes-live</h1>
    <span id="status">未连接</span>
    <span class="spacer"></span>
    <button id="btnInterrupt" disabled>打断</button>
    <button id="btnNewSession">新会话</button>
    <button id="btnToggle" class="primary">开始对话</button>
  </header>

  <div id="stage">
    <div id="orb"></div>
    <div id="stateLabel">点「开始对话」授权麦克风</div>
  </div>

  <div id="transcript"></div>

  <footer>
    <input id="textIn" placeholder="也可以打字（回车发送）…">
    <button id="btnSend">发送</button>
  </footer>

  <script type="module" src="/web/app.js"></script>
</body>
</html>
